name: pymc5
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=1.26.*          # stable pre-NumPy-2 line
  - scipy
  - pandas
  - pymc                  # pulls compatible pytensor
  - arviz
  - xarray
  - matplotlib
  - seaborn
  - scikit-learn
  - statsmodels
  - pyarrow
  - fastparquet
  - tqdm
  - pip
  - peewee
  - pip:
      - arch              # OK via pip in this env
      - finagg
      - mplfinance
      - parallel-pandas
      - pandarallel
      - nasdaq-data-link
      - global_macro_data
      - pomegranate
      - moviepy
